{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="auth-page">
  <form class="auth-card" method="post" action="/login">
    <h1 class="auth-title">登录</h1>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <label>用户名
      <input type="text" name="username" required autofocus placeholder="请输入用户名">
    </label>
    <label>密码
      <input type="password" name="password" required placeholder="请输入密码">
    </label>
    <button class="btn btn-primary auth-btn" type="submit">登 录</button>
    <p class="auth-alt">还没有账号？<a href="/register">立即注册</a></p>
  </form>
</div>
{% endblock %}
