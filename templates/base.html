<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}每日热点{% endblock %} · Daily Hot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="alternate" type="application/rss+xml" title="{{ '每日热点' }} RSS" href="/rss.xml">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="description" content="聚合微博、知乎、百度、B站、抖音等平台的每日热榜，支持智能洞察、趋势共振、RSS 订阅与 Telegram 推送。">
  <meta name="theme-color" content="#d54941" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="每日热点">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <script>
    // 主题尽早应用，避免刷新闪烁：localStorage 优先，其次跟随系统
    (function () {
      try {
        var saved = localStorage.getItem('dh-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <span class="logo-icon">🔥</span>
        <span class="logo-text">每日热点</span>
      </a>
      <nav class="site-nav">
        <a href="/" class="{{ 'active' if request.path == '/' }}">今日热榜</a>
        <a href="/trends" class="{{ 'active' if request.path == '/trends' }}">热度趋势</a>
        <a href="/resonance" class="{{ 'active' if request.path == '/resonance' }}">全网热议</a>
        <a href="/insight" class="{{ 'active' if request.path == '/insight' }}">🧠 洞察</a>
        <a href="/history" class="{{ 'active' if request.path == '/history' }}">历史归档</a>
        <a href="/search" class="{{ 'active' if request.path == '/search' }}">搜索</a>
        <a href="/export" class="{{ 'active' if request.path == '/export' }}">导出</a>
        <a href="/feed" class="{{ 'active' if request.path == '/feed' }}" title="RSS 订阅源预览">📡 RSS</a>
        <button class="theme-toggle" id="themeToggle" type="button" title="切换深色 / 浅色模式" aria-label="切换主题">
          <span class="icon-moon">🌙</span><span class="icon-sun">☀️</span>
        </button>
        {% if current_user %}
        <a href="/me" class="nav-me {{ 'active' if request.path == '/me' }}" title="个人中心：日报 / 收藏 / Telegram / 设置">👤 我的</a>
        <a href="/logout" class="nav-user">{{ current_user.username }} · 退出</a>
        {% else %}
        <a href="/login" class="{{ 'active' if request.path == '/login' }}">登录</a>
        <a href="/register" class="nav-register">注册</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>每日热点 · Python + Flask + MySQL 驱动 · 数据每日自动抓取归档</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
  <script>
    // ---------- 主题切换 ----------
    (function () {
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('dh-theme', next); } catch (e) {}
      });
      // 跟随系统：仅当用户未手动选择时
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener('change', function (e) {
          if (!localStorage.getItem('dh-theme')) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
          }
        });
      } catch (e) {}
    })();

    // ---------- PWA：注册 Service Worker ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/static/sw.js').catch(function () {});
      });
    }

    // ---------- PWA：安装提示 ----------
    (function () {
      var KEY = 'dh-install-dismissed';
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        if (localStorage.getItem(KEY)) return;
        if (!document.querySelector('.install-tip')) {
          var tip = document.createElement('div');
          tip.className = 'install-tip';
          tip.innerHTML = '<span class="tip-text">把每日热点装到手机主屏，像 App 一样用，断网也能看历史</span>' +
            '<span class="tip-actions">' +
            '<button class="btn btn-primary" id="doInstall">安装</button>' +
            '<button class="btn btn-ghost" id="skipInstall">以后再说</button>' +
            '</span><button class="btn-close" id="closeInstall" aria-label="关闭">×</button>';
          document.body.appendChild(tip);
          var dismiss = function () {
            try { localStorage.setItem(KEY, '1'); } catch (err) {}
            tip.remove();
          };
          document.getElementById('skipInstall').addEventListener('click', dismiss);
          document.getElementById('closeInstall').addEventListener('click', dismiss);
          document.getElementById('doInstall').addEventListener('click', function () {
            dismiss();
            if (deferred) {
              deferred.prompt();
              deferred.userChoice.then(function () { deferred = null; });
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
